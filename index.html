<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f04f23" />
    <meta name="description" content="QuickKart — food & grocery delivery (demo)" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <title>QuickKart</title>
    <script>
      try {
        const t = localStorage.getItem('qk-theme');
        if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root">
      <style>
        .qk-init-loader {
          display: flex; justify-content: center; align-items: center; height: 100vh;
          background-color: #f9fafb;
        }
        .dark .qk-init-loader { background-color: #0f172a; }
        .qk-init-spinner {
          width: 40px; height: 40px;
          border: 3px solid rgba(240, 79, 35, 0.2);
          border-top-color: #f04f23;
          border-radius: 50%;
          animation: qk-spin 1s linear infinite;
        }
        @keyframes qk-spin { to { transform: rotate(360deg); } }
      </style>
      <div class="qk-init-loader">
        <div class="qk-init-spinner"></div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
